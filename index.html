  <body>

    <div class="app">

      <main>
        <div class="mobile-topbar" style="display:none">

              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>
    <script src="./supabase-config.js"></script>
    <script src="./supabase-store.js"></script>
    <script>
      (() => {
        "use strict";
        if (typeof globalThis.structuredClone !== "function") {
          globalThis.structuredClone = (v) => JSON.parse(JSON.stringify(v));
        }
        const SHARDS = 64,
          LIMIT = 250000,
          DAY = 864e5;
        const VIEWS = {
          "tong-quan": "Tổng quan",
          "tai-khoan": "Tài khoản MXH",
          gmail: "Kho Gmail",
          "lich-su": "Lịch sử",
          "cai-dat": "Cài đặt",
        };
        const DEF = {
          staleDays: 7,
          statuses: [
            { id: "live", name: "Live", color: "#2fbf71" },
            { id: "dead", name: "Die", color: "#ef5350" },
            { id: "new", name: "Chưa kiểm tra", color: "#8b95a7" },
          ],
        };
        const FIELDS = [
          ["platform", "Nền tảng"],
          ["uid", "UID"],
          ["name", "Tên"],
          ["pass", "Mật khẩu"],
          ["twofa", "2FA"],
          ["email", "Gmail"],
          ["mailpass", "Pass Gmail"],
          ["born", "Ngày tạo"],
          ["checked", "Kiểm tra gần nhất"],
          ["status", "Live/Die"],
          ["phone", "Số điện thoại"],
          ["source", "Nguồn"],
          ["note", "Ghi chú"],
        ];
        const SECRETS = ["pass", "twofa", "mailpass"];
        const ORDER = [
          "platform",
          "uid",
          "name",
          "pass",
          "twofa",
          "email",
          "mailpass",
          "born",
          "checked",
          "status",
        ];
        const LABEL = Object.fromEntries(FIELDS);
        const $ = (s) => document.querySelector(s);
        const PATHS = {
          grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
          users:
            '<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 2.7-5.5 6-5.5s6 2 6 5.5M16 5a3.5 3.5 0 0 1 0 6.5M18 15c2 .7 3 2.5 3 5"/>',
          folder:
            '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
          clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
          gear: '<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
          lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
          unlock:
            '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/>',
          up: '<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',
          down: '<path d="M12 4v12M7 11l5 5 5-5M4 20h16"/>',
          plus: '<path d="M12 5v14M5 12h14"/>',
          check: '<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
          x: '<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>',
          eye: '<path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/>',
          off: '<path d="M4 4l16 16M9.5 5.8A10 10 0 0 1 12 5.500c6.500 0 10 6.500 10 6.500a17 17 0 0 1-3 3.700M6 7.500A17 17 0 0 0 2 12s3.500 6.500 10 6.500a10 10 0 0 0 4-.800"/>',
          copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>',
          key: '<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M16 7l3 3"/>',
          edit: '<path d="M4 20h4L19 9l-4-4L4 16zM13.500 6.500l4 4"/>',
          facebook:
            '<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>',
          instagram:
            '<rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>',
          mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3 7 12 13 21 7"/>',
          info: '<circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
          ext: '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>',
          bolt: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
          refresh:
            '<path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3L21.5 8M22 12.5a10 10 0 0 1-18.8 4.2L2.5 16"/>',
        };
        const PLATFORMS = {
          facebook: {
            id: "facebook",
            name: "Facebook",
            color: "#1877f2",
            icon: "facebook",
            url: (uid) =>
              /^\d+$/.test(uid)
                ? `https://www.facebook.com/profile.php?id=${encodeURIComponent(uid)}`
                : `https://www.facebook.com/${encodeURIComponent(uid)}`,
          },
          instagram: {
            id: "instagram",
            name: "Instagram",
            color: "#e1306c",
            icon: "instagram",
            url: (uid) =>
              `https://www.instagram.com/${encodeURIComponent(uid)}/`,
          },
        };
        const plat = (p) => PLATFORMS[p] || PLATFORMS.facebook;
        const platOf = (a) => PLATFORMS[a?.platform] || PLATFORMS.facebook;
        const pillPlat = (p) => {
          const pl = plat(p);
          return `<span class="pill" style="--c:${pl.color};gap:5px">${icon(pl.icon)}${pl.name}</span>`;
        };
        const icon = (n) =>
          `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${PATHS[n]}</svg>`;
        const ib = (act, v, ic, label) =>
          `<button class="ico" data-act="${act}" data-v="${v}" title="${label}" aria-label="${label}">${icon(ic)}</button>`;
        const NAVI = {
          "tong-quan": "grid",
          "tai-khoan": "users",
          gmail: "mail",
          "lich-su": "clock",
          "cai-dat": "gear",
        };
        const SUB = {
          "tong-quan": "Tình hình kho tài nguyên",
          "tai-khoan": "Tra cứu, cập nhật tài khoản Facebook & Instagram",
          gmail: "Lưu trữ tài khoản Gmail, mật khẩu và ghi chú",
          "lich-su": "Các thay đổi gần đây",
          "cai-dat": "Trạng thái, bảo mật và dữ liệu",
        };
        const esc = (v) =>
          String(v ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
        const norm = (s) =>
          String(s ?? "")
            .normalize("NFD")
            .replace(/[̀-ͯ]/g, "")
            .replace(/đ/gi, "d")
            .toLowerCase()
            .trim();
        const today = () => {
          const d = new Date();
          return new Date(d - d.getTimezoneOffset() * 6e4)
            .toISOString()
            .slice(0, 10);
        };
        const fmt = (t) =>
          t
            ? new Date(t).toLocaleDateString("vi-VN", {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
              })
            : "—";
        const fmtTime = (t) =>
          new Date(t).toLocaleString("vi-VN", {
            hour: "2-digit",
            minute: "2-digit",
            day: "2-digit",
            month: "2-digit",
          });
        const store = {
          get(k, d) {
            try {
              return JSON.parse(localStorage.getItem(k)) ?? d;
            } catch {
              return d;
            }
          },
          set(k, v) {
            try {
              localStorage.setItem(k, JSON.stringify(v));
            } catch {}
          },
        };

        let db = null,
          downloads = null,
          mode = "loading",
          localMode = false;
        let authClient = null,
          cloudApi = null,
          cloudWorkspace = null,
          currentUser = null,
          memberRole = null;
        let cloudBusy = false,
          cloudError = "",
          authGeneration = 0;
        const canWrite = () =>
          ready() &&
          !cloudBusy &&
          (localMode || ["editor", "admin"].includes(memberRole));
        const LOCAL_DATA_KEY = "mxh.resources.v1";
        function openLocalStore() {
          const raw = localStorage.getItem(LOCAL_DATA_KEY);
          const saved = raw ? JSON.parse(raw) : {};
          if (!saved || typeof saved !== "object" || Array.isArray(saved))
            throw new Error("Invalid storage");
          shards = Array.from(
            { length: SHARDS },
            (_, i) => saved["shards/s" + i]?.a || {},
          );
          settings = saved["meta/settings"] || structuredClone(DEF);
          daily = saved["meta/daily"]?.days || {};
          localMode = true;
          db = {
            doc: (path) => ({
              async set(body) {
                const current = JSON.parse(
                  localStorage.getItem(LOCAL_DATA_KEY) || "{}",
                );
                current[path] = body;
                localStorage.setItem(LOCAL_DATA_KEY, JSON.stringify(current));
              },
            }),
          };
          // Check write access before allowing data entry.
          localStorage.setItem(LOCAL_DATA_KEY, JSON.stringify(saved));
          mode = "ready";
        }
        let shards = Array.from({ length: SHARDS }, () => ({})),
          settings = structuredClone(DEF),
          daily = {};
        let sel = new Set(),
          q = "",
          fStatus = "",
          fPlatform = "",
          fStale = false,
          page = 1,
          sort = { k: "updated", d: -1 };
        let per = store.get("per", 25),
          cols = store
            .get("cols3", ORDER)
            .filter((c) => !["group", "tags"].includes(c));
        if (!cols.includes("platform")) cols = ["platform", ...cols];
        if (!cols.includes("name")) {
          const uIdx = cols.indexOf("uid");
          if (uIdx >= 0) cols.splice(uIdx + 1, 0, "name");
          else cols.unshift("name");
        }
        let qGmail = "",
          sortGmail = { k: "updated", d: -1 },
          pageGmail = 1,
          perGmail = 25,
          selGmail = new Set(),
          mailSubTab = "edu",
          fStatusGmail = "",
          fDomainGmail = "",
          fUsageGmail = "";
        function makeGmailUid(email) {
          const clean =
            "gm_" +
            String(email || "")
              .trim()
              .toLowerCase()
              .replace("@", "_at_")
              .replace(/[^A-Za-z0-9._-]/g, "_");
          return clean.slice(0, 60);
        }
        function parseGmailText(text) {
          const lines = text
              .split(/\r?\n/)
              .map((l) => l.trim())
              .filter(Boolean),
            items = [];
          for (const line of lines) {
            let parts;
            if (line.includes("|")) parts = line.split("|");
            else if (line.includes(":") && !line.startsWith("http"))
              parts = line.split(":");
            else if (line.includes("\t")) parts = line.split("\t");
            else if (line.includes(",")) parts = line.split(",");
            else if (line.includes(" ")) parts = line.split(/\s+/);
            else parts = [line];

            const rawFirst = (parts[0] || "").trim();
            const emailM = rawFirst.match(/([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})$/);
            const email = emailM ? emailM[1].toLowerCase() : rawFirst;
            if (!email || !email.includes("@")) continue;
            const prefixNote = emailM
              ? rawFirst.slice(0, rawFirst.length - emailM[1].length).trim()
              : "";
            const pass = parts[1]?.trim() || "";
            let p2 = (parts[2] || "").trim();
            let p3 = (parts[3] || "").trim();
            const clientIdPattern = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
            if (clientIdPattern.test(p2) && p3.length > 30) [p2, p3] = [p3, p2];
            const isOAuth =
              p2.length > 30 &&
              /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(p3);
            const note = isOAuth
              ? [prefixNote, ...parts.slice(4)].filter(Boolean).join(" ").trim()
              : [prefixNote, ...parts.slice(2)].filter(Boolean).join("|").trim();
            items.push({
              email,
              pass,
              note,
              ...(isOAuth ? { refreshToken: p2, clientId: p3 } : {}),
            });
          }
          return items;
        }
        const ready = () => mode === "ready" || mode === "demo";

        const hash = (s) => {
          let h = 2166136261;
          for (const c of s) {
            h ^= c.charCodeAt(0);
            h = Math.imul(h, 16777619);
          }
          return (h >>> 0) % SHARDS;
        };
        const all = () => shards.flatMap((s) => Object.values(s));
        const get = (uid) => {
          const s = shards[hash(uid)];
          return Object.prototype.hasOwnProperty.call(s, uid) ? s[uid] : undefined;
        };
        const st = (id) =>
          settings.statuses.find((s) => s.id === id) || {
            id,
            name: "Không rõ",
            color: "#8b95a7",
          };
        const stale = (a) =>
          !a.checked ||
          Date.now() - new Date(a.checked + "T00:00:00") >
            settings.staleDays * DAY;
        const groups = () => [],
          tagsAll = () => [];
        const pill = (id) => {
          const s = st(id);
          return `<span class="pill" style="--c:${esc(s.color)}"><span class="dot"></span>${esc(s.name)}</span>`;
        };

        /* ---------- lưu trữ: mỗi shard là 1 document, ghi tuần tự ---------- */
        const jobs = new Map(); // path -> {dirty,busy,failed,data()}
        function queue(path, data) {
          if (mode !== "ready") return;
          let j = jobs.get(path);
          if (!j) {
            j = {};
            jobs.set(path, j);
          }
          j.data = data;
          j.dirty = true;
          j.failed = false;
          run(path, j);
        }
        async function run(path, j) {
          if (j.busy) return;
          j.busy = true;
          saveState();
          while (j.dirty) {
            j.dirty = false;
            try {
              const body = JSON.parse(JSON.stringify(j.data()));
              try {
                await db.doc(path).set(body);
              } catch (e) {
                if (e.code !== "unavailable") throw e;
                await new Promise((r) => setTimeout(r, 800));
                await db.doc(path).set(body);
              }
            } catch (e) {
              j.failed = e.code || "unavailable";
              j.dirty = true;
              toast(
                e.code === "quota_exceeded" || e.name === "QuotaExceededError"
                  ? "Hết dung lượng lưu trữ. Hãy xuất dữ liệu để sao lưu."
                  : "Chưa lưu được. Bấm “Thử lại” ở góc trạng thái.",
                "error",
              );
              break;
            }
          }
          j.busy = false;
          saveState();
        }
        function saveState() {
          const el = $("#save"),
            mobEl = $("#mob-save-state"),
            v = [...jobs.values()];
          const syncMob = () => {
            if (mobEl) {
              const dot = cloudBusy || v.some((j) => j.busy || j.dirty) ? '<span style="color:#5b8cff">●</span>' : '<span style="color:#2fbf71">●</span>';
              mobEl.innerHTML = `${dot} ${el.textContent || "Đã lưu"}`;
            }
          };
          if (!localMode) {
            el.textContent = cloudBusy
              ? "Đang lưu lên Supabase…"
              : cloudError
                ? "Chưa lưu được · " + cloudError
                : mode === "login"
                  ? "Cần đăng nhập"
                  : mode === "denied"
                    ? "Chưa được cấp quyền"
                    : mode === "loading"
                      ? "Đang kết nối Supabase…"
                      : "Đã lưu trên Supabase";
            syncMob();
            return;
          }
          if (v.some((j) => j.failed)) {
            el.innerHTML =
              '<span class="err">Lỗi lưu.</span> <button class="link" data-act="retry">Thử lại</button>';
            if (mobEl) mobEl.innerHTML = '<span style="color:#ef5350">●</span> Lỗi lưu';
            return;
          }
          el.textContent =
            mode === "loading"
              ? "Đang tải dữ liệu…"
              : mode === "denied"
                ? "Không thể mở kho dữ liệu"
                : v.some((j) => j.busy || j.dirty)
                  ? "Đang lưu…"
                  : localMode
                    ? "Đã lưu trên trình duyệt này"
                    : "Đã lưu online";
          syncMob();
        }
        addEventListener("beforeunload", (e) => {
          if (cloudBusy || [...jobs.values()].some((j) => j.busy || j.dirty)) {
            e.preventDefault();
            e.returnValue = "";
          }
        });
        const pending = (p) => {
          const j = jobs.get(p);
          return j && (j.busy || j.dirty);
        };
        const saveShard = (i) =>
          queue("shards/s" + i, () => ({ a: shards[i] }));
        const saveSettings = () => queue("meta/settings", () => settings);
        function snapshotDay() {
          const c = {};

        function extractEmailUuid(a) {

        let sharedAudioCtx = null;
        function getAudioCtx() {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          if (!sharedAudioCtx || sharedAudioCtx.state === "closed") {
            sharedAudioCtx = new AudioCtx();
          }
          if (sharedAudioCtx.state === "suspended") {
            sharedAudioCtx.resume().catch(() => {});
          }
          return sharedAudioCtx;
        }
        ["pointerdown", "keydown"].forEach((evt) => {
          window.addEventListener(
            evt,
            () => {
              try {
                getAudioCtx();
              } catch {}
            },
            { passive: true },
          );
        });

        function playChime(type = "success") {
          try {
            const ctx = getAudioCtx();
            if (!ctx) return;
            const trigger = () => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.connect(gain);
              gain.connect(ctx.destination);
              const now = ctx.currentTime;
              if (type === "otp") {
                osc.type = "triangle";
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.09);
                osc.frequency.setValueAtTime(1046.5, now + 0.18);
                gain.gain.setValueAtTime(0.16, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
              } else if (type === "mail") {
                osc.type = "sine";
                osc.frequency.setValueAtTime(659.25, now);
                osc.frequency.setValueAtTime(880, now + 0.11);
                gain.gain.setValueAtTime(0.14, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
                osc.start(now);
                osc.stop(now + 0.36);
              } else if (type === "error") {
                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(140, now + 0.16);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
              } else {
                osc.type = "sine";
                osc.frequency.setValueAtTime(587.33, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
                osc.start(now);
                osc.stop(now + 0.26);
              }
            };
            if (ctx.state === "suspended") {
              ctx.resume().then(trigger).catch(() => {});
            } else {
              trigger();
            }
          } catch (e) {}
        }

        function requestNotificationPermission() {

        function extractOtp(text, subject = "") {
          const cleanSubj = String(subject || "").trim();
          if (cleanSubj) {
            // 1. Tiêu đề bắt đầu bằng mã số: "20857 là mã xác nhận Facebook của bạn"
            const startM = cleanSubj.match(/^([0-9]{4,8})\b/);
            if (startM) return startM[1];

            // 2. Số đứng trước từ khóa xác nhận: "20857 là mã...", "20857 is your code..."
            const beforeKey = cleanSubj.match(
              /\b([0-9]{4,8})\s*(?:là|is|:|-|\s)\s*(?:mã|code|otp|pin|xác nhận|xác minh|verification)/i,
            );
            if (beforeKey) return beforeKey[1];

            // 3. Từ khóa đứng trước số: "mã xác nhận: 20857"
            const afterKey = cleanSubj.match(
              /(?:mã|code|otp|pin|xác nhận|xác minh|verification|security)\D{0,10}?([0-9]{4,8})\b/i,
            );
            if (afterKey) return afterKey[1];

            // 4. Nếu tiêu đề chỉ có đúng 1 cụm số 4-8 chữ số
            const allSubjDigits = cleanSubj.match(/\b([0-9]{4,8})\b/g);
            if (allSubjDigits && allSubjDigits.length === 1)

          // Quét nội dung body sạch
          let cleanBody = String(text || "");

          cleanBody = cleanBody.replace(/<[^>]+>/g, " ");
          cleanBody = cleanBody.replace(/&(?:nbsp|amp|quot|lt|gt);/g, " ");

          // 1. Từ khóa xác nhận trong body
          const m1 = cleanBody.match(
            /(?:mã|code|otp|pin|xác nhận|xác minh|verification|security code)\D{0,15}?([0-9]{4,8})\b/i,
          );
          if (m1) return m1[1];

          // 2. Số đứng trước từ khóa trong body
          const m2 = cleanBody.match(
            /\b([0-9]{4,8})\s*(?:là|is|:|-|\s)\s*(?:mã|code|otp|pin|xác nhận|xác minh)/i,
          );
          if (m2) return m2[1];

          // 3. Số 6 chữ số độc lập
          const m3 = cleanBody.match(/\b([0-9]{6})\b/);
          if (m3 && !["123456", "000000"].includes(m3[1])) return m3[1];

          // 4. Số 5 hoặc 4 chữ số độc lập
          const m4 = cleanBody.match(/\b([0-9]{5})\b/);
          if (m4) return m4[1];
          const m5 = cleanBody.match(/\b([0-9]{4})\b/);
          if (m5) return m5[1];

          return null;
        }

              const { data, error } = await authClient.auth.getSession();

              const ac = typeof AbortController === "function" ? new AbortController() : null;

                };
              }
              const answers = dnsData.Answer || [];
              const hasMx = answers.some((ans) => ans.type === 15);
              if (!hasMx && dnsData.Status !== 0) {
                return {
                  status: "dead",
                  reason: `Domain ${domain} không có bản ghi MX nhận thư`,
                };
              }
            }
          } catch (e) {
            console.warn("DNS check error:", e);
          }

          // 2. Nếu là Tempamail (.EDU / Temp Mail có uuid)
          const uuid = extractEmailUuid(a);
          if (uuid) {
            try {
              const res = await fetch("https://api.tempamail.com/v1/manage", {
                method: "POST",
                headers: {
                  "Content-Type": "application/x-www-form-urlencoded",
                },
                body: new URLSearchParams({
                  action: "access",
                  email_uuid: uuid,
                  client_uuid: "unknown",
                  app_uuid: "a5x-cj6a-ka1q",
                }),
              });
              if (!res.ok) {
                return {
                  status: "dead",
                  reason: `Hòm thư đã hết hạn hoặc bị xóa trên máy chủ (HTTP ${res.status})`,
                };
              }
              const data = await res.json();
              if (data && (data.client || data.success || data.email)) {
                return {
                  status: "live",
                  reason: "Hòm thư còn sống và sẵn sàng nhận thư!",
                };
              } else if (data && data.error) {
                return { status: "dead", reason: data.error };
              }
            } catch (err) {
              return {
                status: "unknown",
                reason: `Lỗi kết nối máy chủ Tempamail: ${err.message}`,
              };
            }
          }

          return {
            status: "live",
            reason: "Tên miền thư hoạt động bình thường",
          };
        }

        async function triggerBackgroundScan() {
          if (!autoCheckBgEnabled || isBgScanning || !canWrite() || cloudBusy)
            return;
          const currentToday = today();
          const queue = all().filter(
            (a) =>
              a.platform !== "gmail" &&
              (a.platform === "instagram" ? (!a.igCheck?.at || Date.now() - Date.parse(a.igCheck.at) > 6 * 60 * 60 * 1000) : a.checked !== currentToday),
          );
          if (!queue.length) {
            updateBgStatus(
              `<span style="color:#2fbf71">●</span> Đã quét xong hôm nay`,
              true,
            );
            setTimeout(() => updateBgStatus("", false), 5000);
            return;
          }

          isBgScanning = true;
          updateBgStatus(
            `<span style="color:#5b8cff">⚡</span> Quét ngầm: 0/${queue.length}...`,
            true,
          );

          let liveCount = 0,
            dieCount = 0;
          const updated = [];

          for (let i = 0; i < queue.length; i++) {
            if (!autoCheckBgEnabled) break;
            const a = queue[i];
            updateBgStatus(
              `<span style="color:#5b8cff">⚡</span> Quét ngầm [${i + 1}/${queue.length}]: <span class="mono">${esc(a.uid)}</span>...`,
              true,
            );

            const res = await checkAccountLive(a);
            if (res.stale) continue;
            if (!autoCheckBgEnabled) break;

            const oldStatus = a.status;
            let newStatus = oldStatus;
            if (res.status === "live") {
              liveCount++;
              newStatus = "live";
            } else if (res.status === "dead") {
              dieCount++;
              newStatus = "dead";
            }

            if (
              a.platform === "instagram" || (res.status !== "unknown" &&
              (newStatus !== oldStatus || a.checked !== currentToday))
            ) {
              const rev = revise(
                a,
                a.platform === "instagram" ? igResultPatch(res) : { status: newStatus, checked: currentToday },
                "Quét ngầm tự động",
                a.platform === "instagram" ? "IG: " + (res.reason || res.status) : undefined,
              );
              if (rev) {
                updated.push(rev);
                if (oldStatus === "live" && newStatus === "dead") {
                  toast(`⚠️ Phát hiện UID ${a.uid} đã DIE!`, "error");
                }
              }
            }

            if (updated.length >= 5) {
              const chunk = updated.splice(0, updated.length);
              await commit(chunk);
              if (route() === "tai-khoan") table();
            }

            await new Promise((r) => setTimeout(r, 1200));
          }

          if (updated.length) {
            await commit(updated);
            if (route() === "tai-khoan") table();
          }

          isBgScanning = false;
          updateBgStatus(
            `<span style="color:#2fbf71">✓</span> Quét xong: ${liveCount} Live, ${dieCount} Die`,
            true,
          );
          setTimeout(() => updateBgStatus("", false), 7000);
        }

        function parseText(text) {
          text = text.replace(/^\ufeff/, "");
          const first = text.split(/\r?\n/).find((l) => l.trim()) || "";
          const delim = ["\t", "|", ";", ","]
            .map((d) => [d, first.split(d).length])
            .sort((a, b) => b[1] - a[1])[0][0];
          const rows = [];
          let row = [],
            f = "",
            quoted = false;
          for (let i = 0; i < text.length; i++) {
            const c = text[i];
            if (quoted) {
              if (c === '"') {
                if (text[i + 1] === '"') {
                  f += '"';
                  i++;
                } else quoted = false;
              } else f += c;
            } else if (c === '"' && !f) quoted = true;
            else if (c === delim) {
              row.push(f);
              f = "";
            } else if (c === "\n") {
              row.push(f);
              rows.push(row);
              row = [];
              f = "";
            } else if (c !== "\r") f += c;
          }
          row.push(f);
          rows.push(row);
          return rows.filter((r) => r.some((x) => x.trim()));
        }

            }
            return;

          try {
            await downloads.save({ filename, data });

            if (e.code !== "declined")
              toast("Chưa tải được file. Hãy thử lại sau.");
          }

                  note,
                  status: "live",
                  added: Date.now(),
                  updated: Date.now(),

        /* ---------- đăng nhập và kho Supabase ---------- */
        function applyCloudState(state) {
          shards = Array.from({ length: SHARDS }, () => ({}));
          for (const row of state.resources)
            shards[hash(row.uid)][row.uid] = row.data;
          settings =
            state.meta.find((row) => row.key === "settings")?.data ||
            structuredClone(DEF);
          daily =
            state.meta.find((row) => row.key === "daily")?.data?.days || {};
        }
        function clearPrivateData() {
          shards = Array.from({ length: SHARDS }, () => ({}));
          settings = structuredClone(DEF);
          daily = {};
          shown.clear();
          sel.clear();
          selGmail.clear();
          qGmail = "";
          jobs.clear();
          cloudWorkspace = null;
          memberRole = null;
          cloudBusy = false;
          for (const id of ["#dlg", "#drawer"]) {
            const d = $(id);
            if (d.open) d.close();
            d.innerHTML = "";
          }
        }
        function renderLogin(v) {
          v.innerHTML = `<section class="panel login-panel"><h2>Đăng nhập kho tài nguyên</h2><p class="muted">Chỉ tài khoản được chủ kho cấp quyền mới xem và thao tác được dữ liệu.</p><form id="loginForm"><label>Email<input id="loginEmail" type="email" autocomplete="username" required maxlength="254"></label><label>Mật khẩu đăng nhập<input id="loginPassword" type="password" autocomplete="current-password" required></label><p id="loginError" class="err" role="alert" hidden></p><button class="primary" id="loginSubmit">Đăng nhập</button></form></section>`;
          $("#loginForm").onsubmit = async (e) => {
            e.preventDefault();
            const button = $("#loginSubmit"),
              error = $("#loginError");
            if (button.disabled) return;
            button.disabled = true;
            button.textContent = "Đang đăng nhập…";
            error.hidden = true;
            const password = $("#loginPassword");
            try {
              const result = await authClient.auth.signInWithPassword({
                email: $("#loginEmail").value.trim(),
                password: password.value,
              });
              password.value = "";
              if (result.error) throw result.error;
              await loadSession(result.data.session);
            } catch {
              error.textContent =
                "Đăng nhập thất bại. Kiểm tra email, mật khẩu và kết nối mạng.";
              error.hidden = false;
              password.value = "";
            } finally {
              if (button.isConnected) {
                button.disabled = false;
                button.textContent = "Đăng nhập";
              }
            }
          };
        }
        async function loadSession(session, force = false) {
          if (
            session &&
            currentUser?.id === session.user.id &&
            !force &&
            (mode === "ready" || mode === "loading")
          )
            return;
          const generation = ++authGeneration;
          clearPrivateData();
          currentUser = session?.user || null;
          cloudError = "";
          if (!session) {
            mode = "login";
            render();
            return;
          }
          mode = "loading";
          render();
          try {
            const role = await cloudApi.membership(session.user.id);
            if (generation !== authGeneration) return;
            if (!["viewer", "editor", "admin"].includes(role)) {
              mode = "denied";
              render();
              return;
            }
            const workspace = MXHCloud.workspace(cloudApi),
              state = await workspace.load();
            if (generation !== authGeneration) return;
            cloudWorkspace = workspace;
            memberRole = role;
            applyCloudState(state);
            mode = "ready";
            render();
            startAutoCheckScheduler();
          } catch {
            if (generation !== authGeneration) return;
            mode = "denied";
            cloudError =
              "Không tải được kho Supabase. Kiểm tra kết nối rồi bấm Tải lại.";
            render();
          }
        }
        async function persistSettings(next) {
          mutationEpoch++;
          if (!canWrite()) {
            toast(
              "Bạn không có quyền sửa cài đặt hoặc hệ thống đang lưu",
              "error",
            );
            return false;
          }
          if (!cloudWorkspace) {
            settings = next;
            saveSettings();
            return true;
          }
          const generation = authGeneration,
            workspace = cloudWorkspace;
          cloudBusy = true;
          cloudError = "";
          saveState();
          try {
            const state = await workspace.settings(next);
            if (generation !== authGeneration) return false;
            applyCloudState(state);
            toast("Đã lưu cài đặt");
            return true;
          } catch (error) {
            if (generation !== authGeneration) return false;
            cloudError =
              error.code === "40001"
                ? "Cài đặt đã đổi ở nơi khác. Bấm Tải lại."
                : "Không lưu được cài đặt. Kiểm tra kết nối.";
            toast(cloudError, "error");
            return false;
          } finally {
            if (generation === authGeneration) {
              cloudBusy = false;
              render();
            }
          }
        }
        function migrateLocal() {
          if (!canWrite())
            return toast("Bạn không có quyền nhập dữ liệu", "error");
          let saved;
          try {
            saved = JSON.parse(localStorage.getItem(LOCAL_DATA_KEY) || "{}");
          } catch {
            return toast("Không đọc được dữ liệu cũ", "error");
          }
          const rows = [];
          for (let i = 0; i < SHARDS; i++)
            for (const a of Object.values(saved["shards/s" + i]?.a || {})) {
              if (a.sample || get(a.uid)) continue;
              if (
                !/^[A-Za-z0-9._-]{1,60}$/.test(a.uid || "") ||
                a.uid.startsWith("__")
              )
                return toast("Dữ liệu cũ có UID không hợp lệ", "error");
              if (a.sec && typeof a.sec === "string")
                return toast(
                  "Dữ liệu cũ còn mã hoá. Hãy xuất từ bản cũ rồi nhập lại.",
                  "error",
                );
              rows.push(a);
            }
          if (!rows.length)
            return toast(
              "Không có tài khoản cũ cần chuyển trên trình duyệt này",
            );
          ask(
            "Chuyển dữ liệu lên Supabase",
            `Chuyển ${rows.length} tài khoản chưa có trong kho? Bỏ qua UID trùng, giữ nguyên bản cũ trên trình duyệt.`,
            async () => {
              if (!(await commit(rows))) return false;
              toast("Đã chuyển dữ liệu lên Supabase");
            },
          );
        }
        async function boot() {
          render();
          try {
            if (
              !globalThis.MXH_SUPABASE ||
              !globalThis.supabase?.createClient ||
              !globalThis.MXHCloud
            )
              throw Error("Missing configuration");
            authClient = supabase.createClient(
              MXH_SUPABASE.url,
              MXH_SUPABASE.key,
              {
                auth: {
                  persistSession: true,
                  autoRefreshToken: true,
                  detectSessionInUrl: false,
                },
              },
            );
            cloudApi = MXHCloud.create({
              ...MXH_SUPABASE,
              getToken: async () => {
                const { data, error } = await authClient.auth.getSession();
                if (error || !data.session)
                  throw Object.assign(Error("Session expired"), {
                    status: 401,
                  });
                return data.session.access_token;
              },
            });
            $("#btnAuth").onclick = async () => {
              if (cloudBusy) return;
              const { error } = await authClient.auth.signOut({
                scope: "local",
              });
              if (error)
                return toast("Đăng xuất thất bại. Hãy thử lại.", "error");
              await loadSession(null);
              toast("Đã đăng xuất");
            };
            $("#btnRefresh").onclick = async () => {
              if (cloudBusy) return;
              if ($("#drawer").open || $("#dlg").open)
                return toast(
                  "Hãy lưu hoặc đóng bảng đang sửa trước khi tải lại",
                  "error",
                );
              const { data, error } = await authClient.auth.getSession();
              if (error)
                return toast("Không kiểm tra được phiên đăng nhập", "error");
              await loadSession(data.session, true);
            };
            authClient.auth.onAuthStateChange((event, session) => {
              if (event === "SIGNED_OUT") {
                loadSession(null);
                return;
              }
              if (event === "SIGNED_IN")
                setTimeout(() => loadSession(session), 0);
            });
            const { data, error } = await authClient.auth.getSession();
            if (error) throw error;
            await loadSession(data.session);
          } catch {
            mode = "denied";
            cloudError =
              "Chưa kết nối được dịch vụ đăng nhập. Kiểm tra mạng rồi tải lại trang.";
            render();
          }
        }

        boot();
      })();
    </script>
  </body>
</html>
