<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kho tài khoản MXH (Facebook &amp; Instagram)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sidebar cố định + topbar + lưới KPI, biểu đồ, danh sách; chi tiết trượt từ phải. Chỉ giao diện tối. */
:root{color-scheme:dark;--bg:#0a0e17;--side:#0e1320;--panel:#121929;--raise:#1a2338;--line:#232e47;--fg:#e8edf7;--mute:#8e9bb5;--accent:#5b8cff;--accent-ink:#07112b;--danger:#f0625f;--ok:#2fbf71;--warn:#e5b53b;
--sans:"Be Vietnam Pro",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 11px;min-width:0;max-width:100%}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);padding:0}
input[type=color]{padding:2px;width:44px;height:36px}
textarea{width:100%;resize:vertical}
button{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap;font-weight:500}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.danger{color:var(--danger)}
button.link{background:none;border:0;padding:0;color:var(--accent)}
button.mini{padding:3px 9px;font-size:12px}
button.ico{width:27px;height:27px;padding:0;background:none;border-color:transparent;color:var(--mute)}
button.ico:hover:not(:disabled){color:var(--fg);background:var(--raise);border-color:var(--line)}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px))}
nav{background:var(--side);border-right:1px solid var(--line);margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:20px 14px 20px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh}
.brand{display:flex;gap:11px;align-items:center;padding:0 6px 22px;font-weight:700;line-height:1.3}
.brand span{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand span svg.i{width:21px;height:21px}
.brand small{display:block;font-weight:400;color:var(--mute);font-size:12px}
nav a{color:var(--mute);text-decoration:none;padding:9px 11px;border-radius:9px;display:flex;align-items:center;gap:11px;font-weight:500}
nav a:hover{color:var(--fg);background:var(--panel)}
nav a[aria-current]{background:color-mix(in srgb,var(--accent) 17%,transparent);color:var(--fg);font-weight:600}
nav a[aria-current] svg{color:var(--accent)}
nav a .num{margin-left:auto;font-size:11.5px;background:var(--raise);border-radius:99px;padding:0 8px}
.vaultbox{margin-top:auto;border:1px solid var(--line);border-radius:11px;padding:12px;display:grid;gap:3px;background:var(--panel)}
#vstate{font-weight:600;font-size:13px;display:flex;align-items:center}
#save{font-size:12px;color:var(--mute)}
#identity{font-size:11px;color:var(--mute);overflow-wrap:anywhere;margin-bottom:6px}
.login-panel{width:min(440px,100%);margin:48px auto;padding:28px}
.login-panel label{margin-top:14px}.login-panel button{margin-top:20px;width:100%}
main{padding:0 0 90px 24px;min-width:0;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:18px 0 16px;border-bottom:1px solid var(--line)}
.title{margin-right:auto;min-width:0}
h1{font-size:22px;margin:0;line-height:1.3}
#subtitle{color:var(--mute);font-size:12.5px}
h2{font-size:14px;margin:0 0 14px;font-weight:600}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.banner{border:1px solid color-mix(in srgb,var(--warn) 55%,transparent);background:color-mix(in srgb,var(--warn) 9%,transparent);border-radius:10px;padding:9px 13px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.view{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.stat{display:grid;grid-template-columns:minmax(0,1fr) auto;justify-items:start;text-align:left;background:var(--panel);border-radius:14px;padding:16px 18px;gap:4px;white-space:normal}
.stat .lbl{color:var(--mute);font-size:13px;align-self:center}
.stat .tile{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.stat b{grid-column:1/-1;font-size:32px;line-height:1.15}
.stat small{grid-column:1/-1;color:var(--mute);font-weight:400}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px;flex:none}
.pill{display:inline-flex;align-items:center;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 15%,transparent);font-size:12px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.wide{grid-column:span 2}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:16px}
.donut{position:relative;width:180px;margin:0 auto 14px}
.donut svg{display:block;width:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:13}
.donut div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut b{font-size:28px;line-height:1.2}
.donut small{color:var(--mute)}
.keys{display:grid;gap:2px}
.keys button{justify-content:space-between;background:none;border-color:transparent;padding:5px 8px;font-weight:400}
.chart{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 10px}
.yaxis{display:flex;flex-direction:column;justify-content:space-between;height:210px;text-align:right;color:var(--mute);font-size:11.5px;margin-block:-8px;height:226px}
.trend{display:flex;align-items:flex-end;gap:2px;height:210px;background:linear-gradient(var(--line),var(--line)) top/100% 1px no-repeat,linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat;border-bottom:1px solid var(--line)}
.col{flex:1;display:flex;flex-direction:column-reverse;align-items:center;gap:2px;height:100%;min-width:0}
.col:hover{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.col i{display:block;width:min(70%,22px);background:var(--c);min-height:2px}
.col i:last-child{border-radius:4px 4px 0 0}
.axis{grid-column:2;display:flex;justify-content:space-between;color:var(--mute);font-size:11.5px;margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--mute);margin-top:10px}
.bar{display:grid;grid-template-columns:130px minmax(0,1fr) 56px;gap:10px;align-items:center;padding:5px 0}
.track{display:flex;gap:2px;height:8px;background:var(--bg);border-radius:5px;overflow:hidden}
.track i{display:block;height:100%;background:var(--c)}
.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute)}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
.row:first-of-type{border-top:0}
.row>span{min-width:0;overflow-wrap:anywhere}
.who{display:flex;gap:11px;align-items:center}
.who small{display:block;color:var(--mute)}
.big{font-size:30px;font-weight:700;line-height:1.2}
.muted{color:var(--mute)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools .grow{flex:1 1 220px}
.filters{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border-radius:99px;background:none;padding:5px 13px}
.tabs button[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 20%,transparent);border-color:var(--accent)}
.bulk{background:var(--raise);border:1px solid var(--accent);border-radius:12px;padding:9px 12px}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
th:first-child,td:first-child{padding-left:14px}
th{color:var(--mute);font-weight:500;font-size:12px;background:var(--side)}
th button{background:none;border:0;padding:0;color:inherit}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--raise)!important}
tr:last-child td{border-bottom:0}
.mono{font-family:var(--mono);font-size:12.5px}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:1px 7px;margin-right:4px;color:var(--mute)}
.empty{text-align:center;padding:48px 16px;color:var(--mute)}
.empty div{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.sec{display:inline-flex;gap:1px;align-items:center}
.sec>:first-child{margin-right:5px}
select.state{padding:3px 8px;font-size:12px;border-radius:99px;border-color:color-mix(in srgb,var(--c) 70%,transparent);background:color-mix(in srgb,var(--c) 16%,var(--panel))}
details{position:relative}
summary{cursor:pointer;list-style:none;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px 14px}
details .menu{position:absolute;right:0;top:44px;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:10px 14px;z-index:5;display:grid;gap:7px;white-space:nowrap}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(680px,calc(100% - 24px));max-height:90%}
dialog.drawer{margin:auto;height:auto;max-height:calc(100dvh - 32px);width:min(720px,calc(100% - 32px));box-sizing:border-box;border-radius:16px;padding:22px;overflow-y:auto;overscroll-behavior:contain}
dialog::backdrop{background:#03060dbb}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:grid;gap:4px;font-size:12px;color:var(--mute);align-content:start;min-width:0}
label>*{font-size:14px;color:var(--fg)}
.full{grid-column:1/-1}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.actions .left{margin-right:auto}
.err{color:var(--danger);margin:8px 0 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:9px;max-width:calc(100% - 32px);z-index:20;margin:0;border:0;inset-block-start:auto}
#tip{position:fixed;pointer-events:none;background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12px;white-space:pre;z-index:30}
@media (max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:minmax(0,1fr)}.wide{grid-column:auto}}
@media (max-width:760px){
.app{display:block}
nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border:0;border-bottom:1px solid var(--line);margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:12px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
.brand{width:100%;padding:0 4px 8px}
nav a{padding:6px 9px;gap:7px}
.vaultbox{width:100%;margin-top:6px;padding:8px 11px}
main{padding-left:0}
.title{width:100%}
.form{grid-template-columns:1fr}
.stat{padding:13px}.stat b{font-size:26px}
.bar{grid-template-columns:105px minmax(0,1fr) 46px}
}
</style>

<div class="app">
<nav aria-label="Chính"><div class="brand"><span id="logo"></span><div>Kho tài khoản<small>Facebook &amp; Instagram</small></div></div><div id="menu" style="display:contents"></div><div class="vaultbox"><div id="identity"></div><div id="save" role="status"></div></div></nav>
<main>

</main>
</div>
<div id="tip" hidden></div>
<dialog id="dlg"></dialog>
<dialog id="drawer" class="drawer"></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
(()=>{
"use strict";
const SHARDS=64, LIMIT=250000, DAY=864e5;
const VIEWS={"tong-quan":"Tổng quan","tai-khoan":"Tài khoản MXH","gmail":"Kho Gmail","lich-su":"Lịch sử","cai-dat":"Cài đặt"};
const DEF={staleDays:7,statuses:[
{id:"live",name:"Live",color:"#2fbf71"},{id:"dead",name:"Die",color:"#ef5350"},{id:"new",name:"Chưa kiểm tra",color:"#8b95a7"}]};
const FIELDS=[["platform","Nền tảng"],["uid","UID"],["name","Tên"],["pass","Mật khẩu"],["twofa","2FA"],["email","Gmail"],["mailpass","Pass Gmail"],["born","Ngày tạo"],["checked","Kiểm tra gần nhất"],["status","Live/Die"],["phone","Số điện thoại"],["source","Nguồn"],["note","Ghi chú"]];
const SECRETS=["pass","twofa","mailpass"];
const ORDER=["platform","uid","name","pass","twofa","email","mailpass","born","checked","status"];
const LABEL=Object.fromEntries(FIELDS);
const $=s=>document.querySelector(s);
const PATHS={grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 2.7-5.5 6-5.5s6 2 6 5.5M16 5a3.5 3.5 0 0 1 0 6.5M18 15c2 .7 3 2.5 3 5"/>',
folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
gear:'<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
unlock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/>',
up:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',down:'<path d="M12 4v12M7 11l5 5 5-5M4 20h16"/>',plus:'<path d="M12 5v14M5 12h14"/>',
check:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',x:'<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>',
eye:'<path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/>',
off:'<path d="M4 4l16 16M9.5 5.8A10 10 0 0 1 12 5.500c6.500 0 10 6.500 10 6.500a17 17 0 0 1-3 3.700M6 7.500A17 17 0 0 0 2 12s3.500 6.500 10 6.500a10 10 0 0 0 4-.800"/>',
copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>',
key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M16 7l3 3"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16zM13.500 6.500l4 4"/>',
facebook:'<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>',
instagram:'<rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>',
mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3 7 12 13 21 7"/>',info:'<circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',ext:'<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>',bolt:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',refresh:'<path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3L21.5 8M22 12.5a10 10 0 0 1-18.8 4.2L2.5 16"/>'};
const PLATFORMS={
  facebook:{id:"facebook",name:"Facebook",color:"#1877f2",icon:"facebook",url:uid=>/^\d+$/.test(uid)?`https://www.facebook.com/profile.php?id=${encodeURIComponent(uid)}`:`https://www.facebook.com/${encodeURIComponent(uid)}`},
  instagram:{id:"instagram",name:"Instagram",color:"#e1306c",icon:"instagram",url:uid=>`https://www.instagram.com/${encodeURIComponent(uid)}/`}
};
const plat=p=>PLATFORMS[p]||PLATFORMS.facebook;
const platOf=a=>PLATFORMS[a?.platform]||PLATFORMS.facebook;
const pillPlat=p=>{const pl=plat(p);return `<span class="pill" style="--c:${pl.color};gap:5px">${icon(pl.icon)}${pl.name}</span>`};
const icon=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${PATHS[n]}</svg>`;
const ib=(act,v,ic,label)=>`<button class="ico" data-act="${act}" data-v="${v}" title="${label}" aria-label="${label}">${icon(ic)}</button>`;
const NAVI={"tong-quan":"grid","tai-khoan":"users","gmail":"mail","lich-su":"clock","cai-dat":"gear"};
const SUB={"tong-quan":"Tình hình kho tài nguyên","tai-khoan":"Tra cứu, cập nhật tài khoản Facebook & Instagram","gmail":"Lưu trữ tài khoản Gmail, mật khẩu và ghi chú","lich-su":"Các thay đổi gần đây","cai-dat":"Trạng thái, bảo mật và dữ liệu"};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/gi,"d").toLowerCase().trim();
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fmt=t=>t?new Date(t).toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric"}):"—";
const fmtTime=t=>new Date(t).toLocaleString("vi-VN",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit"});
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

let db=null,downloads=null,mode="loading",localMode=false;
let authClient=null,cloudApi=null,cloudWorkspace=null,currentUser=null,memberRole=null;
let cloudBusy=false,cloudError="",authGeneration=0;
const canWrite=()=>ready()&&!cloudBusy&&(localMode||["editor","admin"].includes(memberRole));
const LOCAL_DATA_KEY="mxh.resources.v1";
function openLocalStore(){

    }finally{if(generation===authGeneration){cloudBusy=false;render()}}
  }
  const next=new Map(),edit=i=>{if(!next.has(i))next.set(i,{...shards[i]});return next.get(i)};
  for(const u of del)delete edit(hash(u))[u];

}

/* mã 6 số từ khoá 2FA (TOTP, RFC 6238), tính ngay trên trình duyệt */
async function totp(secret,now=Date.now()){
  const t=secret.replace(/[\s=-]/g,"").toUpperCase();if(!/^[A-Z2-7]{16,}$/.test(t))return null;
  let bits="";for(const c of t)bits+="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567".indexOf(c).toString(2).padStart(5,"0");
  const bytes=new Uint8Array(bits.match(/.{8}/g).map(x=>parseInt(x,2)));
  const msg=new DataView(new ArrayBuffer(8));msg.setUint32(4,Math.floor(now/30000));
  const k=await crypto.subtle.importKey("raw",bytes,{name:"HMAC",hash:"SHA-1"},false,["sign"]);
  const h=new Uint8Array(await crypto.subtle.sign("HMAC",k,msg.buffer)),o=h[19]&15;
  return String((((h[o]&127)<<24)|(h[o+1]<<16)|(h[o+2]<<8)|h[o+3])%1e6).padStart(6,"0");
}

function extractEmailUuid(a){
  if(!a)return null;
  const pass=String(secretsOf(a).pass||a.pass||"").trim();
  const m=pass.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
  if(m)return m[0];
  const noteM=String(a.note||"").match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
  if(noteM)return noteM[0];
  return null;
}

function extractOtp(text,subject=""){
  const combined=(subject+" "+text);
  const patterns=[
    /(?:mã|code|otp|pin|verification)\s*(?:is|là|:|\-)?\s*([0-9]{4,8})\b/i,
    /\b([0-9]{6})\b/,
    /\b([0-9]{4,5})\b/
  ];
  for(const p of patterns){
    const m=combined.match(p);
    if(m&&m[1])return m[1];
  }
  return null;
}

async function fetchTempMailDomains(tld="edu"){

    const res=await fetch("https://api.tempamail.com/v1/domains",{
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body
    });
    const d=await res.json();
    return d.domains||[];
  }catch(e){
    console.error("fetch domains error",e);
    return [];
  }
}

        <button type="button" class="mini" id="btnRefreshInbox" title="Làm mới">${icon("refresh")} Tải lại</button>

    </div>

    <div id="inboxList" style="display:grid;gap:10px;min-height:140px">
      <div style="text-align:center;padding:30px 10px;color:var(--mute)">

        Đang tải hộp thư...

  const statusEl=d.querySelector("#inboxStatus"),listEl=d.querySelector("#inboxList"),btnRefresh=d.querySelector("#btnRefreshInbox"),autoCheck=d.querySelector("#autoCheck"),btnClose=d.querySelector("#btnCloseInbox");

  let clientUuid="unknown",isFetching=false;

  const stopPolling=()=>{
    if(inboxPollInterval){clearInterval(inboxPollInterval);inboxPollInterval=null;}
  };

  btnClose.onclick=()=>{stopPolling();d.close();};
  d.addEventListener("close",stopPolling,{once:true});

  const fetchInbox=async()=>{
    if(isFetching)return;
    isFetching=true;
    try{
      if(clientUuid==="unknown"){
        const accRes=await fetch("https://api.tempamail.com/v1/manage",{
          method:"POST",
          headers:{"Content-Type":"application/x-www-form-urlencoded"},
          body:new URLSearchParams({
            action:"access",
            email_uuid:emailUuid,
            client_uuid:"unknown",
            app_uuid:"a5x-cj6a-ka1q"
          })
        });
        const accData=await accRes.json();
        if(accData&&accData.client&&accData.client.uuid){
          clientUuid=accData.client.uuid;
        }
      }

      const res=await fetch("https://api.tempamail.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:new URLSearchParams({
          client_uuid:clientUuid,
          email_uuid:emailUuid,
          last_message_id:0

      const data=await res.json();
      const messages=(data&&data.messages)||[];

      statusEl.innerHTML=`<span style="color:#2fbf71">●</span> Lắng nghe thư (Lần cuối: ${new Date().toLocaleTimeString("vi-VN")})`;

      if(!messages.length){
        listEl.innerHTML=`<div style="text-align:center;padding:32px 10px;background:rgba(255,255,255,0.02);border:1px dashed var(--line);border-radius:10px;color:var(--mute)">

          <div style="font-size:12px;margin-top:4px">Chưa có thư hoặc mã OTP nào gửi đến <b style="color:var(--fg)">${esc(email)}</b>.<br>Hệ thống vẫn đang tự động canh thư...</div>
        </div>`;
        return;
      }

      let html="";
      for(const m of messages){
        const fromRaw=typeof m.from==="object"?(m.from.name||m.from.address):String(m.from||"");
        const subject=m.subject||"(Không có tiêu đề)";
        const body=m.body||"";
        const otp=extractOtp(body,subject);
        const time=m.created_at?new Date(m.created_at).toLocaleString("vi-VN"):"";
        const msgId="msg_"+m.id;

        html+=`<div style="background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap">
            <div>
              <div style="font-weight:600;color:var(--fg);font-size:13.5px">${esc(subject)}</div>
              <div style="font-size:11.5px;color:var(--mute);margin-top:2px">Từ: <span style="color:var(--fg)">${esc(fromRaw)}</span> · ${esc(time)}</div>
            </div>
            <button type="button" class="mini" data-toggle-msg="${msgId}" style="align-self:flex-start">👁️ Xem nội dung</button>
          </div>

          ${otp?`
          <div style="display:flex;justify-content:space-between;align-items:center;background:rgba(47,191,113,0.12);border:1px solid #2fbf71;border-radius:8px;padding:8px 12px;margin-top:4px">
            <div>
              <div style="font-size:11px;font-weight:700;color:#2fbf71;text-transform:uppercase;letter-spacing:0.5px">MÃ XÁC NHẬN OTP:</div>
              <div style="font-size:22px;font-weight:800;letter-spacing:4px;color:#2fbf71;font-family:var(--mono)">${esc(otp)}</div>
            </div>
            <button type="button" class="primary" style="background:#2fbf71;border-color:#2fbf71;color:#07112b;font-weight:700;padding:6px 12px" onclick="navigator.clipboard.writeText('${esc(otp)}');toast('Đã chép OTP: ${esc(otp)}')">📋 Copy OTP</button>
          </div>
          `:""}

          <div id="${msgId}" style="display:none;margin-top:8px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;max-height:300px;overflow-y:auto;background:var(--bg);border-radius:6px;padding:10px">
            <div style="font-family:inherit;word-break:break-word">${body}</div>
          </div>
        </div>`;
      }

      listEl.innerHTML=html;

      listEl.querySelectorAll("[data-toggle-msg]").forEach(btn=>{
        btn.onclick=()=>{
          const target=listEl.querySelector("#"+btn.dataset.toggleMsg);
          if(target){
            const isHidden=target.style.display==="none";
            target.style.display=isHidden?"block":"none";
            btn.textContent=isHidden?"Ẩn nội dung":"👁️ Xem nội dung";
          }
        };
      });

    }catch(err){
      console.error(err);
      statusEl.innerHTML=`<span style="color:#ef5350">Lỗi: ${esc(err.message)}</span>`;
    }finally{
      isFetching=false;
    }
  };

  btnRefresh.onclick=()=>fetchInbox();

  autoCheck.onchange=()=>{
    if(autoCheck.checked){
      startPolling();
    }else{
      stopPolling();
      statusEl.textContent="Đã tắt tự động làm mới.";
    }
  };

  const startPolling=()=>{
    stopPolling();
    inboxPollInterval=setInterval(()=>{
      if(d.open&&autoCheck.checked)fetchInbox();
    },3000);
  };

  d.showModal();
  fetchInbox();
  startPolling();
}

function openGmail(uid){

  dialog(`<h2>${old?"Chỉnh sửa Gmail":"Thêm tài khoản Gmail"}</h2>
    <label>Địa chỉ Gmail<input id="g-email" type="email" value="${esc(old?.email||"")}" placeholder="user@gmail.com" ${old?"readonly":""} required autocomplete="off"></label>

      const targetUid=old?old.uid:makeGmailUid(email);
      if(!old&&get(targetUid))return "Địa chỉ Gmail này đã có trong kho.";
      const record={uid:targetUid,email,platform:"gmail",sec:{pass},pass,note,status:old?.status||"live",added:old?.added||Date.now(),updated:Date.now()};
      if(!await commit([record]))return cloudError||"Không lưu được Gmail.";

    }
  );
}

    async d=>{

      let add=0,up=0,skip=0;

        const uid=makeGmailUid(item.email),old=get(uid);

        const record={uid,email:item.email,platform:"gmail",sec:{pass:item.pass},pass:item.pass,note:item.note||(old?.note||""),status:old?.status||"live",added:old?.added||Date.now(),updated:Date.now()};
        if(old)up++;else add++;
        put.set(uid,record);
      }
      if(!put.size)return `Không có gì để nhập. Bỏ qua ${skip} tài khoản đã có.`;
      if(!await commit([...put.values()]))return cloudError||"Chưa lưu được dữ liệu. Vui lòng thử lại.";

    <div class="tablewrap" style="max-height:180px"><table>
      <thead><tr><th>STT</th><th>Gmail</th><th>Mật khẩu</th><th>Ghi chú</th></tr></thead>

      ${parsed.length>50?`<tr><td colspan="4" class="muted" style="text-align:center">… và ${parsed.length-50} tài khoản khác</td></tr>`:""}
      </tbody></table></div>`;
  };
  $("#pasteGmail").oninput=e=>{parsed=parseGmailText(e.target.value);updatePreview()};
  $("#fileGmail").onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{const text=await f.text();$("#pasteGmail").value=text;parsed=parseGmailText(text);updatePreview()}catch{toast("Không đọc được file TXT này","error")}
  };
}

function parseText(text){

    if(quoted){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else quoted=false}else f+=c}
    else if(c==='"'&&!f)quoted=true;else if(c===delim){row.push(f);f=""}
    else if(c==="\n"){row.push(f);rows.push(row);row=[];f=""}else if(c!=="\r")f+=c}

  shards=Array.from({length:SHARDS},()=>({}));
  for(const row of state.resources)shards[hash(row.uid)][row.uid]=row.data;
  settings=state.meta.find(row=>row.key==='settings')?.data||structuredClone(DEF);
  daily=state.meta.find(row=>row.key==='daily')?.data?.days||{};
}
function clearPrivateData(){
  shards=Array.from({length:SHARDS},()=>({}));settings=structuredClone(DEF);daily={};
  shown.clear();sel.clear();selGmail.clear();qGmail="";jobs.clear();cloudWorkspace=null;memberRole=null;cloudBusy=false;
  for(const id of ['#dlg','#drawer']){const d=$(id);if(d.open)d.close();d.innerHTML=''}
}
function renderLogin(v){
  v.innerHTML=`<section class="panel login-panel"><h2>Đăng nhập kho tài nguyên</h2><p class="muted">Chỉ tài khoản được chủ kho cấp quyền mới xem và thao tác được dữ liệu.</p><form id="loginForm"><label>Email<input id="loginEmail" type="email" autocomplete="username" required maxlength="254"></label><label>Mật khẩu đăng nhập<input id="loginPassword" type="password" autocomplete="current-password" required></label><p id="loginError" class="err" role="alert" hidden></p><button class="primary" id="loginSubmit">Đăng nhập</button></form></section>`;
  $('#loginForm').onsubmit=async e=>{
    e.preventDefault();const button=$('#loginSubmit'),error=$('#loginError');
    if(button.disabled)return;button.disabled=true;button.textContent='Đang đăng nhập…';error.hidden=true;
    const password=$('#loginPassword');
    try{
      const result=await authClient.auth.signInWithPassword({email:$('#loginEmail').value.trim(),password:password.value});
      password.value='';if(result.error)throw result.error;
      await loadSession(result.data.session);
    }catch{error.textContent='Đăng nhập thất bại. Kiểm tra email, mật khẩu và kết nối mạng.';error.hidden=false;password.value=''}
    finally{if(button.isConnected){button.disabled=false;button.textContent='Đăng nhập'}}
  };
}
async function loadSession(session,force=false){
  if(session&&currentUser?.id===session.user.id&&!force&&(mode==='ready'||mode==='loading'))return;
  const generation=++authGeneration;
  clearPrivateData();currentUser=session?.user||null;cloudError='';
  if(!session){mode='login';render();return}
  mode='loading';render();
  try{
    const role=await cloudApi.membership(session.user.id);
    if(generation!==authGeneration)return;
    if(!['viewer','editor','admin'].includes(role)){mode='denied';render();return}
    const workspace=MXHCloud.workspace(cloudApi),state=await workspace.load();
    if(generation!==authGeneration)return;
    cloudWorkspace=workspace;memberRole=role;applyCloudState(state);mode='ready';render();
  }catch{
    if(generation!==authGeneration)return;
    mode='denied';cloudError='Không tải được kho Supabase. Kiểm tra kết nối rồi bấm Tải lại.';render();
  }
}
async function persistSettings(next){
  if(!canWrite()){toast('Bạn không có quyền sửa cài đặt hoặc hệ thống đang lưu','error');return false}
  if(!cloudWorkspace){settings=next;saveSettings();return true}
  const generation=authGeneration,workspace=cloudWorkspace;
  cloudBusy=true;cloudError='';saveState();
  try{const state=await workspace.settings(next);if(generation!==authGeneration)return false;applyCloudState(state);toast('Đã lưu cài đặt');return true}
  catch(error){if(generation!==authGeneration)return false;cloudError=error.code==='40001'?'Cài đặt đã đổi ở nơi khác. Bấm Tải lại.':'Không lưu được cài đặt. Kiểm tra kết nối.';toast(cloudError,'error');return false}
  finally{if(generation===authGeneration){cloudBusy=false;render()}}
}
function migrateLocal(){
  if(!canWrite())return toast('Bạn không có quyền nhập dữ liệu','error');
  let saved;
  try{saved=JSON.parse(localStorage.getItem(LOCAL_DATA_KEY)||'{}')}catch{return toast('Không đọc được dữ liệu cũ','error')}
  const rows=[];
  for(let i=0;i<SHARDS;i++)for(const a of Object.values(saved['shards/s'+i]?.a||{})){
    if(a.sample||get(a.uid))continue;
    if(!/^[A-Za-z0-9._-]{1,60}$/.test(a.uid||'')||a.uid.startsWith('__'))return toast('Dữ liệu cũ có UID không hợp lệ','error');
    if(a.sec&&typeof a.sec==='string')return toast('Dữ liệu cũ còn mã hoá. Hãy xuất từ bản cũ rồi nhập lại.','error');
    rows.push(a);
  }
  if(!rows.length)return toast('Không có tài khoản cũ cần chuyển trên trình duyệt này');
  ask('Chuyển dữ liệu lên Supabase',`Chuyển ${rows.length} tài khoản chưa có trong kho? Bỏ qua UID trùng, giữ nguyên bản cũ trên trình duyệt.`,async()=>{
    if(!await commit(rows))return false;toast('Đã chuyển dữ liệu lên Supabase');
  });
}
async function boot(){
  render();
  try{
    if(!globalThis.MXH_SUPABASE||!globalThis.supabase?.createClient||!globalThis.MXHCloud)throw Error('Missing configuration');
    authClient=supabase.createClient(MXH_SUPABASE.url,MXH_SUPABASE.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
    cloudApi=MXHCloud.create({...MXH_SUPABASE,getToken:async()=>{
      const {data,error}=await authClient.auth.getSession();
      if(error||!data.session)throw Object.assign(Error('Session expired'),{status:401});
      return data.session.access_token;
    }});
    $('#btnAuth').onclick=async()=>{
      if(cloudBusy)return;
      const {error}=await authClient.auth.signOut({scope:'local'});
      if(error)return toast('Đăng xuất thất bại. Hãy thử lại.','error');
      await loadSession(null);toast('Đã đăng xuất');
    };
    $('#btnRefresh').onclick=async()=>{
      if(cloudBusy)return;
      if($('#drawer').open||$('#dlg').open)return toast('Hãy lưu hoặc đóng bảng đang sửa trước khi tải lại','error');
      const {data,error}=await authClient.auth.getSession();
      if(error)return toast('Không kiểm tra được phiên đăng nhập','error');
      await loadSession(data.session,true);
    };
    authClient.auth.onAuthStateChange((event,session)=>{
      if(event==='SIGNED_OUT'){loadSession(null);return}
      if(event==='SIGNED_IN')setTimeout(()=>loadSession(session),0);
    });
    const {data,error}=await authClient.auth.getSession();if(error)throw error;
    await loadSession(data.session);
  }catch{mode='denied';cloudError='Chưa kết nối được dịch vụ đăng nhập. Kiểm tra mạng rồi tải lại trang.';render()}
}

boot();
})();
</script>
